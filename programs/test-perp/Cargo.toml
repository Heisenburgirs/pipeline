[package]
name = "test-perp"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "A minimal perpetuals venue for Pipeline's tests and devnet demos: oracle-priced markets, leveraged long or short positions, partial closes"

[lib]
crate-type = ["cdylib", "lib"]
name = "test_perp"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []
no-log-ix-name = []

[dependencies]
anchor-lang = "=1.2.2"
anchor-spl = "=1.2.2"
